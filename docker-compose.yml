version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-backend
    ports:
      - "6060:6060"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - LIFEOS_PORT=6060
      - SIDECAR_URL=http://sidecar:3002
      - MCP_API_KEY=${MCP_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
    volumes:
      - lifeos-data:/app  # Persist SQLite database
    restart: unless-stopped
    networks:
      - lifeos-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:6060}
    container_name: lifeos-frontend
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - lifeos-network

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: lifeos-sidecar
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - lifeos-network

networks:
  lifeos-network:
    driver: bridge

volumes:
  lifeos-data:
