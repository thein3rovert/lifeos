version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-backend
    ports:
      - "6060:6060"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - LIFEOS_PORT=6060
      - SIDECAR_URL=http://sidecar:3002
      - MCP_API_KEY=${MCP_API_KEY}
      - LIFEOS_PUBLIC_URL=${LIFEOS_PUBLIC_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
    volumes:
      - lifeos-data:/app # Persist SQLite database
    restart: unless-stopped
    networks:
      - lifeos-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: lifeos-frontend
    ports:
      - "3001:3000"
    environment:
      # Optional: override API URL. If unset, frontend auto-detects from
      # window.location (works for direct IP access on port 3001).
      - API_URL=${API_URL:-}
    restart: unless-stopped
    networks:
      - lifeos-network

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: lifeos-sidecar
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - OPENCODE_URL=${OPENCODE_URL:-http://host.containers.internal:4097}
    restart: unless-stopped
    networks:
      - lifeos-network

networks:
  lifeos-network:
    driver: bridge

volumes:
  lifeos-data:
