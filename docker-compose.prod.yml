# Production compose: pulls pre-built images from Docker Hub
# Usage: podman-compose -f docker-compose.prod.yml up -d
#
# Uses the same volume name (lifeos-data) as docker-compose.yml so the
# SQLite database persists when switching between dev and prod modes.

services:
  backend:
    image: docker.io/theintrovert/lifeos-backend:latest
    container_name: lifeos-backend
    ports:
      - "6060:6060"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - LIFEOS_PORT=6060
      - SIDECAR_URL=http://sidecar:3002
      - MCP_API_KEY=${MCP_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
    volumes:
      - lifeos-data:/app
    restart: unless-stopped
    networks:
      - lifeos-network

  frontend:
    image: docker.io/theintrovert/lifeos-frontend:latest
    container_name: lifeos-frontend
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - lifeos-network

  sidecar:
    image: docker.io/theintrovert/lifeos-sidecar:latest
    container_name: lifeos-sidecar
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - OPENCODE_URL=${OPENCODE_URL:-http://host.containers.internal:4097}
    restart: unless-stopped
    networks:
      - lifeos-network

networks:
  lifeos-network:
    driver: bridge

volumes:
  lifeos-data:
