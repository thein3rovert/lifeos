# Production compose: pulls pre-built images from Docker Hub
# Usage: podman-compose -f docker-compose.prod.yml up -d
#
# Uses the same volume name (lifeos-data) as docker-compose.yml so the
# SQLite database persists when switching between dev and prod modes.

services:
  backend:
    image: docker.io/theintrovert/lifeos-backend:latest
    container_name: lifeos-backend
    ports:
      - "${BACKEND_PORT:-7060}:6060"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - LIFEOS_PORT=6060
      - SIDECAR_URL=http://sidecar:3002
      - MCP_API_KEY=${MCP_API_KEY}
      - BACKEND_PORT=${BACKEND_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MCP_ALLOWED_DIRS=${MCP_ALLOWED_DIRS}
      - LIFEOS_MEETINGS_PATH=${LIFEOS_MEETINGS_PATH}
      - LIFEOS_JOURNAL_PATH=${LIFEOS_JOURNAL_PATH}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    volumes:
      - lifeos-data:/app
      - /home/thein3rovert/Documents/resources/work_Elanco:/home/thein3rovert/Documents/resources/work_Elanco:ro
    restart: unless-stopped
    networks:
      - lifeos-network

  frontend:
    image: docker.io/theintrovert/lifeos-frontend:latest
    container_name: lifeos-frontend
    ports:
      - "${FRONTEND_PORT:-7001}:3000"
    restart: unless-stopped
    networks:
      - lifeos-network

  sidecar:
    image: docker.io/theintrovert/lifeos-sidecar:latest
    container_name: lifeos-sidecar
    ports:
      - "${SIDECAR_PORT:-7002}:3002"
    environment:
      - NODE_ENV=production
      - OPENCODE_URL=${OPENCODE_URL:-http://host.containers.internal:4097}
    restart: unless-stopped
    networks:
      - lifeos-network

networks:
  lifeos-network:
    driver: bridge

volumes:
  lifeos-data:
