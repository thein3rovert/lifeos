name: Build Frontend

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'web/**'
      - '.github/workflows/build-frontend.yml'
      - '.github/workflows/_build-docker.yml'
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: 'VITE_API_URL build arg'
        required: false
        default: 'http://localhost:6060'

jobs:
  build:
    uses: ./.github/workflows/_build-docker.yml
    with:
      image: lifeos-frontend
      context: ./web
      dockerfile: ./web/Dockerfile
      build-args: |
        VITE_API_URL=${{ inputs.vite_api_url || vars.VITE_API_URL || 'http://localhost:6060' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
