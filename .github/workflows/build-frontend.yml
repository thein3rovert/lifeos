name: Build Frontend

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'web/**'
      - '.github/workflows/build-frontend.yml'
      - '.github/workflows/_build-docker.yml'
  workflow_dispatch:

# TODO: Refactor frontend to use runtime config (relative URLs + reverse proxy
# routing, or runtime config.js injection) so the same image works in any
# environment. Currently VITE_API_URL is baked at build time, which means CI
# builds use the default (http://localhost:6060) and the image must be rebuilt
# locally with the correct URL for non-localhost deployments.
# See: web/Dockerfile ARG VITE_API_URL

jobs:
  build:
    uses: ./.github/workflows/_build-docker.yml
    with:
      image: lifeos-frontend
      context: ./web
      dockerfile: ./web/Dockerfile
    secrets: inherit
