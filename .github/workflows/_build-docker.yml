name: Build Docker Image (Reusable)

on:
  workflow_call:
    inputs:
      image:
        description: 'Image name (without registry prefix)'
        required: true
        type: string
      context:
        description: 'Build context path'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      build-args:
        description: 'Build args (multi-line, KEY=VALUE)'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: |
            type=gha,scope=${{ inputs.image }}
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ inputs.image }}
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:buildcache,mode=max

      - name: Image digest
        run: echo "${{ inputs.image }} pushed with digest ${{ steps.meta.outputs.digest }}"
